<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitar Translator</title>
    <script type="module" crossorigin src="/chunks/popup-BwZ8dL9M.js"></script>
    <link rel="modulepreload" crossorigin href="/chunks/translator-client-C2hJHp_6.js">
    <link rel="stylesheet" crossorigin href="/assets/translator-client-BitYn3_v.css">
  </head>
  <body class="w-[340px] p-4 select-none antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="app" class="flex flex-col gap-3.5">
      
      <!-- Minimal Header -->
      <header class="flex items-center justify-between pb-2.5 border-b border-slate-200/60 dark:border-slate-800/60">
        <div class="flex items-center gap-2.5">
          <!-- Sleek Hitar Monogram Orb -->
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-indigo-500/25 ring-1 ring-white/20">
            H
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-sm font-extrabold tracking-tight text-slate-900 dark:text-white">Hitar</h1>
              <span class="px-1.5 py-0.2 rounded-full text-[9px] font-bold bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 uppercase tracking-wider border border-indigo-500/20">FREE</span>
            </div>
            <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Live Page Translator</p>
          </div>
        </div>

        <button id="theme-toggle" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-slate-800/60 transition-all cursor-pointer" title="Toggle Theme">
          <svg id="theme-icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          <svg id="theme-icon-moon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        </button>
      </header>

      <!-- Site Domain Badge -->
      <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-100/90 dark:bg-slate-900/90 border border-slate-200/60 dark:border-slate-800/60 text-xs">
        <div class="flex items-center gap-2 overflow-hidden">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="current-host" class="font-bold truncate max-w-[170px] text-slate-700 dark:text-slate-300">detecting site...</span>
        </div>
        <span id="host-badge" class="px-2 py-0.5 rounded-md text-[9px] font-extrabold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 uppercase tracking-wider">DEFAULT</span>
      </div>

      <!-- Main Action Card -->
      <div class="glass-card p-3 flex flex-col gap-3">
        <!-- Translation Direction Bar -->
        <div class="flex flex-col gap-1">
          <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">
            <span>Source: Auto Detect</span>
            <span class="text-emerald-500 font-bold flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
              ~150ms Engine
            </span>
          </div>
          <select id="target-lang" aria-label="Translate To language" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700/60 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all cursor-pointer">
            <!-- Dynamically populated -->
          </select>
        </div>

        <!-- Primary Action Button -->
        <button id="toggle-translate-btn" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-violet-600 via-indigo-600 to-cyan-500 hover:from-violet-500 hover:to-indigo-400 active:scale-[0.98] text-white font-extrabold text-xs tracking-wide shadow-md shadow-indigo-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <svg id="btn-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3 5 8 8 8-8" />
          </svg>
          <span id="btn-label">Translate Entire Page</span>
        </button>
      </div>

      <!-- Domain Rule Toggles -->
      <div class="glass-card p-3 flex flex-col gap-2">
        <label class="flex items-center justify-between text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
          <span>Always translate this site</span>
          <input type="checkbox" id="always-translate-chk" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
        </label>
        <div class="h-px bg-slate-200/60 dark:bg-slate-800/60"></div>
        <label class="flex items-center justify-between text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
          <span>Never translate this site</span>
          <input type="checkbox" id="never-translate-chk" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
        </label>
      </div>

      <!-- Footer -->
      <footer class="flex items-center justify-between pt-0.5 text-xs text-slate-500 dark:text-slate-400">
        <button id="open-options" class="flex items-center gap-1.5 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all font-bold cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Options &amp; Settings</span>
        </button>
        <span class="text-[10px] font-mono text-slate-400">v0.1.0</span>
      </footer>
    </div>
  </body>
</html>
