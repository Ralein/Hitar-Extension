<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitar Translator</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
  </head>
  <body class="w-[350px] p-4 select-none antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="app" class="flex flex-col gap-4">
      <!-- Header -->
      <header class="flex items-center justify-between pb-3 border-b border-slate-200/80 dark:border-slate-800/80">
        <div class="flex items-center gap-2.5">
          <!-- Distinctive Hitar Logo Orb -->
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white shadow-xl shadow-indigo-500/30 ring-2 ring-white/20 transform hover:scale-105 transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M7 12h10"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 9l3 3-3 3"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-base font-extrabold tracking-tight text-slate-900 dark:text-white">Hitar</h1>
              <span class="px-1.5 py-0.2 rounded text-[9px] font-extrabold tracking-wider bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 uppercase border border-indigo-500/20">PRO</span>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 font-semibold">Live Page Translator</p>
          </div>
        </div>
        <button id="theme-toggle" class="p-2 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-slate-800/60 transition-all cursor-pointer" title="Toggle Theme">
          <svg id="theme-icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="theme-icon-moon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </header>

      <!-- Active Site Status Badge -->
      <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-slate-100/80 dark:bg-slate-900/80 border border-slate-200/80 dark:border-slate-800/80 text-xs">
        <div class="flex items-center gap-2 overflow-hidden">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-sm shadow-emerald-500/50"></span>
          <span id="current-host" class="font-bold truncate max-w-[180px] text-slate-700 dark:text-slate-300">detecting site...</span>
        </div>
        <span id="host-badge" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 uppercase tracking-wider">DEFAULT</span>
      </div>

      <!-- Main Action Card -->
      <div class="glass-card p-3.5 flex flex-col gap-3.5 shadow-sm">
        <!-- Target Language Selector -->
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between items-center">
            <label for="target-lang" class="text-[11px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Translate To</label>
            <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              Fast & 100% Free
            </span>
          </div>
          <select id="target-lang" aria-label="Translate To language" class="w-full bg-slate-100/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-700/80 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all cursor-pointer">
            <!-- Dynamically populated from SUPPORTED_LANGUAGES -->
          </select>
        </div>

        <!-- Primary Action Toggle Button -->
        <button id="toggle-translate-btn" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-violet-600 via-indigo-600 to-indigo-500 hover:from-violet-500 hover:to-indigo-400 active:scale-[0.98] text-white font-extrabold text-xs tracking-wide shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <svg id="btn-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3 5 8 8 8-8"/>
          </svg>
          <span id="btn-label">Translate Entire Page</span>
        </button>
      </div>

      <!-- Per-site preferences options -->
      <div class="glass-card p-3.5 flex flex-col gap-2.5">
        <label class="flex items-center justify-between text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
          <span>Always translate this site</span>
          <input type="checkbox" id="always-translate-chk" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
        </label>
        <div class="h-px bg-slate-200/80 dark:bg-slate-800/80"></div>
        <label class="flex items-center justify-between text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
          <span>Never translate this site</span>
          <input type="checkbox" id="never-translate-chk" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
        </label>
      </div>

      <!-- Footer Links -->
      <footer class="flex items-center justify-between pt-1 text-xs text-slate-500 dark:text-slate-400">
        <button id="open-options" class="flex items-center gap-1.5 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all font-bold cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>Options & Settings</span>
        </button>
        <span class="text-[10px] font-mono text-slate-400">v0.1.0</span>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
